<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odaya katıl — Multiplayer Battle</title>
<meta property="og:title" content="Multiplayer Battle — odama gel!">
<meta property="og:description" content="Bağlantıya dokun, oyun açılsın ve odaya katıl.">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 520px; margin: 0 auto; padding: 32px 16px; line-height: 1.5; text-align: center; background: #10161c; color: #f2f2f2; }
  h1 { font-size: 22px; margin: 8px 0 20px; }
  .code { font-size: 40px; font-weight: 800; letter-spacing: 6px; background: #1d2731; border-radius: 14px; padding: 14px 10px; margin: 12px 0; user-select: all; }
  .btn { display: block; width: 100%; box-sizing: border-box; padding: 14px; margin: 10px 0; border-radius: 12px; border: 0; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .primary { background: #f0b429; color: #1a1a1a; }
  .secondary { background: #2b3845; color: #f2f2f2; }
  .hint { color: #9fb0bf; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>Multiplayer Battle — odaya katıl</h1>
<p class="hint">Arkadaşın seni odasına çağırıyor.</p>

<div id="code" class="code">——</div>

<a id="open" class="btn primary" href="#">Oyunu aç ve katıl</a>
<button id="copy" class="btn secondary" type="button">Kodu kopyala</button>
<p id="copied" class="hint hidden">Kopyalandı! Oyunda <b>Çok oyunculu → Odaya katıl</b>'a yapıştır.</p>

<p class="hint">Oyun açılmadıysa: oyunu aç, <b>Çok oyunculu → Odaya katıl</b>'a kodu yaz.</p>
<a id="get" class="btn secondary hidden" href="#">Oyunu yükle (TestFlight)</a>

<script>
  // Oyunun iOS'ta kaydettiği adres: multiplayerbattle://join/KOD (Editor/UrlScheme).
  // Oyunu yükleme bağlantısı (TestFlight herkese açık bağlantısı) beta onayından sonra buraya.
  var INSTALL_URL = "";

  var raw = new URLSearchParams(location.search).get("c") || "";
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
  var deepLink = "multiplayerbattle://join/" + code;

  document.getElementById("code").textContent = code || "——";
  document.getElementById("open").href = deepLink;

  if (INSTALL_URL) {
    var get = document.getElementById("get");
    get.href = INSTALL_URL;
    get.classList.remove("hidden");
  }

  document.getElementById("copy").addEventListener("click", function () {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code);
    }
    document.getElementById("copied").classList.remove("hidden");
  });

  // Sayfa açılınca oyunu bir kez açmayı dene.
  if (code) {
    setTimeout(function () { location.href = deepLink; }, 300);
  }
</script>
</body>
</html>
